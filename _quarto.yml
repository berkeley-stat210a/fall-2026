project:
  type: website
  render:
    - "**/*.qmd"
    # Kept in the repo but not published. Quarto renders every .qmd by
    # default, so unlisted pages are still reachable at guessable URLs.
    - "!test-ons.qmd"                    # Observable scratch page
    - "!reader/asymptotics.qmd"          # draft chapters, not yet taught from
    - "!reader/convergence.qmd"
    - "!reader/empirical-bayes.qmd"
    - "!reader/likelihood-inference.qmd"
    - "!reader/maximum-likelihood.qmd"
    - "!reader/measure-theory-basics.qmd"
    - "!reader/multiple-testing.qmd"
    - "!reader/testing-linear.qmd"

website:
  site-url: https://stat210a.berkeley.edu/fall-2026/
  google-analytics: G-B8G2041HSB
  sidebar:
    style: docked
    title: "Stat 210a"
    logo: assets/stat_bear.png
    tools:
      - icon: github
        href: https://github.com/berkeley-stat210a/fall-2026
    contents:
      - href: index.qmd
        text: Home / Schedule
      - section: "Course Logistics"
        contents:
          - faq.qmd
          - syllabus.qmd
          - calendar.qmd
      - section: "Course Materials"
        contents:
          - handwritten-notes.qmd
          - homework.qmd
          - recitation.qmd
          - old-exams.qmd
      - section: "Course Reader"
        contents:
          - reader/introduction.qmd
          - reader/probability.qmd
          - reader/estimation.qmd
          - reader/exponential-families.qmd
          - reader/sufficiency.qmd
          - reader/completeness.qmd
          - reader/unbiased-estimation.qmd
          - reader/score-fisher.qmd
          - reader/bayes-estimation.qmd
          - reader/bayes-interpretation.qmd
          - reader/bayes-computation.qmd
          - reader/jamesstein.qmd
          - reader/minimax-estimation.qmd
          - reader/hypothesis-testing.qmd
          - reader/testing-one-parameter.qmd
          - reader/testing-interpretation.qmd
          - reader/testing-nuisance.qmd
      - href: license.qmd
        text: License


format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    include-in-header:
      file: siteimprove.html
